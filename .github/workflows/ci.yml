name: ci

on:
  push:
  pull_request:

jobs:
  builder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pillow
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg   # the ending-video ladder's real build
      - run: python -m pytest tests/builder tests/ladder -q
        env:
          # Ubuntu runners forbid the browser's sandbox (burn.py: an explicit opt-in)
          DK_BROWSER_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}

  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # Publishes the room player to the public site (wrangler.jsonc env "public") after the tests pass on main.
  # Skips quietly until the repository secret CLOUDFLARE_API_TOKEN is set.
  deploy:
    needs: [builder, player]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-public
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy (env public)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
            exit 0
          fi
          npx -y wrangler@4 deploy --env public
