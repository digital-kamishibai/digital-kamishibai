# Records one month's sponsorships for the relay ceiling (src/guard.js: donationKey, readDonation).
# Run by hand once a month from the Actions tab: the month the sponsorships were received (UTC) and their total in USD,
# as the GitHub Sponsors dashboard shows it. The relay watcher adds it to the following month's cap.
# Only people with write access to this repository can run it; the run log records who entered what, and when.
name: donation

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month the sponsorships were received (UTC), YYYY-MM'
        required: true
        type: string
      amount:
        description: 'Total sponsorships for that month in USD, 0 to 1000 (up to two decimals)'
        required: true
        type: string

jobs:
  record:
    runs-on: ubuntu-latest
    concurrency:
      group: donation
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MONTH: ${{ inputs.month }}
      AMOUNT: ${{ inputs.amount }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the input
        # Same limit as DONATION_MAX_USD in src/guard.js: a typo (2500 for 25) must not widen the cap.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          if ! printf '%s' "$MONTH" | grep -Eq '^20[0-9]{2}-(0[1-9]|1[0-2])$'; then
            echo "::error::month must look like 2026-11 (got '$MONTH')."
            exit 1
          fi
          if ! printf '%s' "$AMOUNT" | grep -Eq '^[0-9]+(\.[0-9]{1,2})?$'; then
            echo "::error::amount must be a number such as 25 or 12.50 (got '$AMOUNT')."
            exit 1
          fi
          if ! awk -v a="$AMOUNT" 'BEGIN { exit !(a <= 1000) }'; then
            echo "::error::amount must be 1000 or less (got '$AMOUNT'). Check for a typo."
            exit 1
          fi
      - name: Write to Workers KV (env public)
        run: |
          npx -y wrangler@4 kv key put "donation:$MONTH" "$AMOUNT" --binding TURN_GUARD --env public --remote
          echo "Read back: $(npx -y wrangler@4 kv key get "donation:$MONTH" --binding TURN_GUARD --env public --remote --text)"
          echo "Recorded donation:$MONTH = $AMOUNT USD (used for the following month's relay cap)." >> "$GITHUB_STEP_SUMMARY"
